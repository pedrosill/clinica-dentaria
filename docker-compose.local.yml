services:
  dentalpro:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${DENTALPRO_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      SEED_DEVELOPMENT_DATA: "${SEED_DEVELOPMENT_DATA:-true}"
      PORT: 5000
      HOST: 0.0.0.0
      LOCAL_ONLY: "false"
      CLIENT_ORIGIN: "${DENTALPRO_ORIGIN:-http://localhost:5000}"
      DATABASE_URL: file:/app/data/dentalpro.db
      CLIENT_DIST_DIR: /app/client-dist
      PRIVATE_DOCUMENTS_DIR: /app/data/private-documents
      BACKUP_DIR: /app/data/backups
      BACKUP_SECONDARY_DIR: /app/data/backups-secondary
      BACKUP_ENCRYPTION_KEY: "${BACKUP_ENCRYPTION_KEY:-}"
      BACKUP_ENCRYPTION_REQUIRED: "${BACKUP_ENCRYPTION_REQUIRED:-false}"
      BACKUP_RETENTION_COUNT: "${BACKUP_RETENTION_COUNT:-14}"
    volumes:
      - dentalpro-data:/app/data
      - "${DENTALPRO_SECONDARY_BACKUP_HOST_DIR:-./backups-secondary}:/app/data/backups-secondary"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  dentalpro-data:
